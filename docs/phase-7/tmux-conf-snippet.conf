# tmux.conf snippet — pi-novel-scribe Phase 7 layout
#
# Drop relevant lines into your `~/.tmux.conf` and `tmux source-file ~/.tmux.conf`.
#
# Adds:
#   Prefix + n   — start a pi-novel-scribe pane layout in cwd
#   Prefix + w   — re-open the current chapter in $VISUAL in a new pane
#
# Requires:
#   - tmux ≥ 3.3 (for `${current_path}` substitution)
#   - VISUAL or EDITOR env var set
#   - `pi` on PATH

# ----------------------------------------------------------------------------
# Bind: open pi-novel-scribe working layout (left: pi, middle: shell, right: editor)
# ----------------------------------------------------------------------------
bind n run-shell -d -t. "\
  #!/bin/sh\\n\
  # Start a fresh pi session in the left pane.\\n\
  tmux send-keys -t '${left_pane_id}' 'pi' 'C-m'\\n\
  # Editor pane: open the current chapter (or just spawn $VISUAL).\\n\
  chapter=\"${current_path}/chapters/$(ls -1 ${current_path}/chapters 2>/dev/null | grep -v 'approved\\|canonized' | head -1)\"\\n\
  if [ -n \"$chapter\" ] && [ -f \"$chapter\" ]; then\\n\
    tmux send-keys -t '${right_pane_id}' \"\\$VISUAL \\\\\"$chapter\\\\\"\" 'C-m'\\n\
  else\\n\
    tmux send-keys -t '${right_pane_id}' \"\\$VISUAL\" 'C-m'\\n\
  fi\\n\
"

# ----------------------------------------------------------------------------
# Bind: open current chapter's editor pane (refresh on edits)
# ----------------------------------------------------------------------------
bind w run-shell -d -t. "\
  #!/bin/sh\\n\
  chapter=\"${current_path}/chapters/$(ls -1 ${current_path}/chapters 2>/dev/null | grep -v 'approved\\|canonized' | head -1)\"\\n\
  [ -n \"$chapter\" ] && tmux send-keys -t '${right_pane_id}' \"\\$VISUAL \\\\\"$chapter\\\\\"\" 'C-m'\\n\
"

# ----------------------------------------------------------------------------
# Layout: split-pane (Pi | Shell | Editor) below the Status footer
# ----------------------------------------------------------------------------
# After binding `n`, this layout gives you:
#
#   ┌──────────────────────┬──────────────────────┐
#   │ Pi                   │ Editor               │
#   │                      │                      │
#   │ Director             │ chapter-023.md      │
#   │ Writer               │                      │
#   │ Critic               │                      │
#   ├──────────────────────┴──────────────────────┤
#   │ Status / notes (custom widget)              │
#   └────────────────────────────────────────────┘
#
# To get this layout manually inside an existing tmux session:
#
#   PREFIX v             # vertical split (Pi | Editor)
#   PREFIX ]             # right pane: open $VISUAL
#   PREFIX _             # bottom: 30-row pane for status
#
# Status footer is fed by `extensions/tmux/widget.ts` if pi's custom
# widget is registered; otherwise it's a plain tmux pane.

# ----------------------------------------------------------------------------
# Status bar (optional): bottom-edge of every session
# ----------------------------------------------------------------------------
# Pi-novel-scribe doesn't write to the tmux status line directly.
# For continuity insight, run pi in the main pane and use `watch` in a
# status bar:
#
#   set -g status-interval 5
#   set -g status-right '#{?pi-novel-scribe-active,active,idle} | #(cat ~/.pi-novel-scribe/.status 2>/dev/null)'

# ----------------------------------------------------------------------------
# End of snippet
# ----------------------------------------------------------------------------
